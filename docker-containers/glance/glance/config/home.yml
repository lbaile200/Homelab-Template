  - name: Home
    # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
      #hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

          - type: rss
            limit: 10
            collapse-after: 3
            cache: 12h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://ciechanow.ski/atom.xml
              - url: https://www.joshwcomeau.com/rss.xml
                title: Josh Comeau
              - url: https://samwho.dev/rss.xml
              - url: https://ishadeed.com/feed.xml
                title: Ahmad Shadeed

        # - type: twitch-channels
        #   channels:
        #     - theprimeagen
        #     - j_blow
        #     - piratesoftware
        #     - cohhcarnage
        #     - christitustech
        #     - EJ_SA

      - size: full
        widgets:
          - type: group
            widgets:
              - type: hacker-news
                collapse-after: -1

              - type: reddit
                subreddit: technology
                show-thumbnails: true
                collapse-after: -1
              - type: reddit
                subreddit: selfhosted
                show-thumbnails: true
                collapse-after: -1
              - type: reddit
                subreddit: knoxville
                show-thumbnails: true
                collapse-after: -1
              - type: reddit
                subreddit: formula1
                show-thumbnails: true
                collapse-after: -1
              - type: reddit
                subreddit: f1technical
                show-thumbnails: true
                collapse-after: -1
              - type: reddit
                subreddit: sysadmin
                show-thumbnails: true
                collapse-after: -1
              - type: reddit
                subreddit: linux
                show-thumbnails: true
                collapse-after: -1
              - type: reddit
                subreddit: linux_gaming
                show-thumbnails: true
                collapse-after: -1
              - type: reddit
                subreddit: fedora
                show-thumbnails: true
                collapse-after: -1

      - size: small
        widgets:
          - type: weather
            location: Knoxville, Tennessee, United States
            units: imperial # alternatively "metric"
            hour-format: 12h # alternatively "24h"
            # Optionally hide the location from being displayed in the widget
            # hide-location: true
          - type: releases
            cache: 1d
            # Without authentication the Github API allows for up to 60 requests per hour. You can create a
            # read-only token from your Github account settings and use it here to increase the limit.
            # token: ...
            repositories:
              - glanceapp/glance
              - go-gitea/gitea
              - immich-app/immich
              - syncthing/syncthing

