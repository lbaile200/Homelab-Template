#Main site: Proxy to apache
###20251221 Lucas changing thsi for proper upstream
###location / {
location @circlejerks_www_apache {
   sub_filter 'http://www.' 'https://www.';
   sub_filter_once off;
   proxy_pass http://circlejerks.www.8803.cluster;
   proxy_set_header X-Forwarded-Host $host;
   proxy_set_header X-Forwarded-Server $host;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header Host $host;
   proxy_http_version 1.1;
   proxy_set_header Connection "";

   #### remove this when ready to go live
   #add_header X-Robots-Tag "noindex, nofollow";
}

